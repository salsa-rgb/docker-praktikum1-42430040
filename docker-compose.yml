services:
  # 1. LAYANAN DATABASE POSTGRESQL
  db:
    image: postgres:16-alpine
    container_name: mk40-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume 'pgdata' menjamin data tidak hilang saat kontainer dihapus!
      - pgdata:/var/lib/postgresql/data
      # Menjalankan init.sql secara otomatis saat database pertama kali dibuat
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      # Database HANYA terhubung ke backend-net (terisolasi dari frontend)
      - backend-net
    # KEAMANAN PENTING: Tidak ada 'ports:' di sini agar Database TIDAK bisa diakses langsung dari luar!
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2. LAYANAN BACKEND API (Menggunakan Multi-Stage Dockerfile dari Tahap 3)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend-api:v1.0.0
    container_name: mk40-backend
    restart: unless-stopped
    environment:
      APP_PORT: "8080"
      STUDENT_NIM: ${STUDENT_NIM}
      STUDENT_NAME: ${STUDENT_NAME}
      STORAGE_MODE: "postgres"       # Mengaktifkan mode penyimpanan ke Database PostgreSQL
      DB_HOST: "db"                  # Memanggil kontainer database cukup dengan nama layanannya ('db')
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy   # Tunggu sampai PostgreSQL benar-benar siap menerima koneksi
    networks:
      # Backend menjadi perantara: terhubung ke KEDUA jaringan
      - frontend-net
      - backend-net
    # Healthcheck backend: memeriksa endpoint /healthz
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # 3. LAYANAN FRONTEND WEB (Satu-satunya pintu masuk dari browser pengguna)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend-web:v1.0.0
    container_name: mk40-frontend
    restart: unless-stopped
    ports:
      - "8080:80"                    # Membuka port 8080 di laptop ke port 80 Nginx
    depends_on:
      backend:
        condition: service_healthy   # Tunggu sampai backend berstatus healthy
    networks:
      # Frontend HANYA terhubung ke frontend-net (tidak bisa menjangkau database)
      - frontend-net

# Deklarasi Penyimpanan Persisten (Named Volume)
volumes:
  pgdata:
    name: mk40_pgdata_volume

# Deklarasi Dua Jaringan Terpisah (Dual Bridge Network)
networks:
  frontend-net:
    name: mk40_frontend_net
    driver: bridge
  backend-net:
    name: mk40_backend_net
    driver: bridge